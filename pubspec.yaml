name: petverse
description: Red social para mascotas construida con Flutter Web y Firebase.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  cloud_firestore: ^5.5.1
  cupertino_icons: ^1.0.8
  firebase_auth: ^5.3.4
  firebase_core: ^3.8.1
  firebase_messaging: ^15.2.10
  firebase_storage: ^12.4.10
  file_picker: ^10.3.10
  flutter:
    sdk: flutter
  provider: ^6.1.2
  video_player: ^2.14.1

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
